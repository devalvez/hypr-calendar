# Trecho para o hyprland.conf (sintaxe hyprlang clássica)

plugin = /caminho/para/hypr-calendar.so
# (se instalou com hyprpm: `hyprpm enable hypr-calendar`)

plugin {
    calendar {
        enabled = true
        # monitor: vazio = todos; ou nomes separados por vírgula (DP-1, HDMI-A-1)
        monitor =

        # posição: âncora + margens (as margens empurram para dentro da tela)
        anchor   = top_right          # top_left top top_right left center right bottom_left bottom bottom_right
        offset_x = 60
        offset_y = 60

        width    = 300
        padding  = 26
        rounding = 0

        # idioma e semana
        language       = pt_BR        # en, pt, es, fr, de, it
        week_start     = sunday       # sunday | monday
        weekday_format = short        # short (Dom) | long (Domingo)

        # título (mês)
        title_font  = Allura
        title_size  = 64
        title_color = rgb(111111)
        title_case  = lower           # lower | upper | capitalize

        # ano
        year_font  = Inter
        year_size  = 15
        year_color = rgb(222222)

        # dias da semana
        weekday_font  = Inter
        weekday_size  = 11
        weekday_color = rgb(222222)
        weekday_case  = upper

        # números
        day_font  = Inter
        day_size  = 15
        day_color = rgb(222222)

        # dia de hoje
        today_style            = badge        # none | badge
        today_badge_shape      = circle       # circle | rounded | square
        today_badge_color      = rgb(111111)  # cor do badge
        today_badge_text_color = rgb(ffffff)  # cor do número dentro do badge
        today_badge_size       = 0            # px; 0 = automático

        # fundo e linha
        bg_color   = rgb(ffffff)  # cor do plano de fundo
        bg_opacity = 0.93         # 0.0 transparente ... 1.0 opaco
        line_color = rgb(d9d9d9)
        line_width = 1
    }
}
