# Exemplo para o calendar-preview (e também serve de referência para o plugin).
# Reproduz o visual da imagem de referência: fundo claro, título grande em
# minúsculas, ano pequeno à direita, linha fina e dias da semana em maiúsculas.
#
# Linhas que começam com '#' são comentários.

# --- posição -------------------------------------------------------------
anchor        = top_right
offset_x      = 60
offset_y      = 60

# --- tamanho -------------------------------------------------------------
width         = 300
padding       = 26
rounding      = 0

# --- idioma e semana -----------------------------------------------------
language       = en
week_start     = sunday
weekday_format = short

# --- título (mês) --------------------------------------------------------
# Troque por uma fonte cursiva instalada, ex.: "Allura", "Great Vibes",
# "Dancing Script", "Sacramento"...
title_font    = Sans Italic
title_size    = 54
title_color   = #111111
title_case    = lower

# --- ano -----------------------------------------------------------------
year_font     = Sans
year_size     = 15
year_color    = #222222

# --- dias da semana ------------------------------------------------------
weekday_font  = Sans
weekday_size  = 11
weekday_color = #222222
weekday_case  = upper

# --- números dos dias ----------------------------------------------------
day_font      = Sans
day_size      = 15
day_color     = #222222

# --- dia de hoje (destaque opcional) -------------------------------------
# today_style = none  -> sem destaque (como na imagem de referência)
# today_style = badge -> badge atrás do número do dia atual
today_style            = none
today_badge_shape      = circle     # circle | rounded | square
today_badge_color      = #111111    # cor do badge
today_badge_text_color = #ffffff    # cor do número dentro do badge
today_badge_size       = 0          # px; 0 = automático

# --- fundo e linha -------------------------------------------------------
bg_color      = #ffffff             # cor do plano de fundo
bg_opacity    = 0.93                # 0.0 = transparente ... 1.0 = opaco
line_color    = #d9d9d9
line_width    = 1
